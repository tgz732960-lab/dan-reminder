name: 投骰子提醒

on:
  schedule:
    - cron: '0 0 * * *'   # 早8点 北京时间
    - cron: '0 4 * * *'   # 中午12点
    - cron: '0 12 * * *'  # 晚8点

jobs:
  dice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python dice.py
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
